<title id="title">Narendra Modi second-term approval and performance measures</title>
<desc id="description">India approval and performance measures during Narendra Modi’s second term, from 30 May 2019 to 9 June 2024. Dates are on the horizontal axis and recorded positive percentages are on the vertical axis. Lines are kept separate by polling source and question.</desc>

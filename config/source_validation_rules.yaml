# Pollitik Database — Source-Quality / Anti-Fraud Validation Rules
#
# PLACEHOLDER FILE — awaiting Dr. Evans' source-validation guidance.
#
# Purpose: this is the documented, future home for deterministic and
# semi-deterministic rules for identifying fake, misleading, impersonated,
# or otherwise unreliable websites, to be incorporated once Dr. Evans
# supplies the actual guidance/checklist PDF.
#
# IMPORTANT — DO NOT INVENT CONTENT IN THIS FILE.
#
# Every section below is a structural placeholder only. Do not fill in
# any list with rules, heuristics, keywords, or examples that were not
# explicitly supplied by Dr. Evans' PDF (once provided) or by the user.
# A research agent must never add a rule here based on inference,
# plausibility, or general world knowledge of what "fake site detection"
# usually involves — that is exactly the mistake this file exists to
# prevent (see the pollitik-executive-support Skill's core rule: never
# invent something because it seems plausible).
#
# How this file will be used once populated: the pollitik-executive-support
# Skill's source-provenance rules (sections 5-8) currently check
# retrievability (WebFetch succeeded) and domain approval
# (config/allowed_domains.txt / config/domains/). This file will hold the
# ADDITIONAL layer of judgment about whether an already-retrieved,
# already-approved source is itself authentic/trustworthy - e.g.
# distinguishing a pollster's real site from a copycat or impersonation
# domain that a human might mistakenly approve. Until populated, none of
# these categories are enforced; approval continues to rest solely on the
# existing domain-allowlist + retrieval-verification mechanism.
#
# Categories requested by the project owner (Dr. Evans' forthcoming PDF
# is expected to cover material in these areas — headings only, no rule
# content yet):

